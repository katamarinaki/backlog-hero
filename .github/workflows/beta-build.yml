name: Beta Build

on:
  push:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  build:
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - name: Set beta version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          BASE_TAG=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName -q '.[0].tagName')
          BASE_VERSION="${BASE_TAG#v}"
          if [ -z "$BASE_VERSION" ]; then BASE_VERSION=$(node -p "require('./package.json').version"); fi
          NEXT_PATCH=$(node -e "const v=process.argv[1].split('.').map(Number); console.log([v[0],v[1],v[2]+1].join('.'))" "$BASE_VERSION")
          BETA_VERSION="$NEXT_PATCH-beta.$BUILD_NUMBER"
          npm version "$BETA_VERSION" --no-git-tag-version
          echo "version=$BETA_VERSION" >> "$GITHUB_OUTPUT"
      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: beta
          releaseName: Beta (develop)
          releaseDraft: false
          prerelease: true
          releaseBody: Automated beta build from develop. Enable beta updates in Settings to receive signed updates.
          args: ${{ runner.os == 'Windows' && '--bundles nsis' || '' }} ${{ vars.TAURI_UPDATER_PUBLIC_KEY != '' && '--config src-tauri/tauri.updater.conf.json' || '' }}
          includeUpdaterJson: ${{ vars.TAURI_UPDATER_PUBLIC_KEY != '' }}

  cleanup:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Remove superseded beta installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BETA_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          test -n "$BETA_VERSION"
          gh release view beta --json assets -q '.assets[].name' > beta-assets.txt
          while IFS= read -r asset; do
            if [[ "$asset" =~ [0-9]+\.[0-9]+\.[0-9]+ ]] && [[ "$asset" != *"$BETA_VERSION"* ]]; then
              gh release delete-asset beta "$asset" --yes
            fi
          done < beta-assets.txt
